[workspace]
members = [
  "./packages/backend/native",
  "./packages/common/native",
]
resolver = "3"

  [workspace.package]
  edition = "2024"

  [workspace.dependencies]
  aes-gcm = "0.10"
  affine_common = { path = "./packages/common/native" }
  affine_doc_loader = "0.1.9"
  anyhow = "1"
  base64 = "0.22.1"
  chrono = "0.4"
  criterion = { version = "0.5", features = ["html_reports"] }
  doc_extractor = "0.1.1"
  file-format = { version = "0.28", features = ["reader"] }
  futures-util = "0.3"
  hex = "0.4"
  hkdf = "0.13"
  homedir = "0.3"
  image = { version = "0.25.9", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "webp",
  ] }
  infer = { version = "0.19.0" }
  little_exif = "0.6.23"
  llm_adapter = { version = "0.2", default-features = false }
  llm_runtime = { version = "0.2", default-features = false }
  matroska = "0.30"
  memory-indexer = "0.4.0"
  mimalloc = "0.1"
  mp4parse = "0.17"
  napi = { version = "3.7.0", features = [
    "async",
    "chrono_date",
    "error_anyhow",
    "napi9",
    "serde",
  ] }
  napi-build = { version = "2" }
  napi-derive = { version = "3.4" }
  p256 = { version = "0.13", features = ["ecdsa", "pem"] }
  rand = "0.9"
  rayon = "1.10"
  redis = { version = "1.6", features = ["tokio-comp", "tokio-rustls-comp"] }
  safefetch = "0.1.0"
  schemars = "1.2"
  serde = "1"
  serde_json = "1"
  sha2 = "0.11"
  sha3 = "0.12"
  sqlx = { version = "0.8", default-features = false, features = [
    "chrono",
    "macros",
    "migrate",
    "runtime-tokio",
  ] }
  thiserror = "2"
  tiktoken-rs = "0.7"
  tokio = "1.45"
  url = { version = "2.5" }
  uuid = "1.8"
  v_htmlescape = "0.15"
  y-octo = "0.1.1"
  zeroize = "1.9"

# hashcash minting runs a PoW hash loop that is infeasible at opt-level 0
[profile.dev.package.keccak]
opt-level = 3

[profile.dev.package.sha3]
opt-level = 3

[profile.release]
codegen-units = 1
lto           = "fat"
opt-level     = 3
strip         = "symbols"

