query listNotifications($pagination: PaginationInput!, $read: Boolean! = false) {
  currentUser {
    notifications(pagination: $pagination, read: $read) {
      totalCount
      edges {
        cursor
        node {
          id
          type
          level
          read
          createdAt
          updatedAt
          body
        }
      }
      pageInfo {
        startCursor
        endCursor
        hasNextPage
        hasPreviousPage
      }
    }
  }
}
